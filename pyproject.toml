[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tiny-ldap"
version = "1.2.0"
description = "Rank LDAP dumps into a crown-jewel pyramid and split them into useful files"
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.9"
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Information Technology",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Topic :: System :: Systems Administration",
    "Topic :: Utilities",
]
keywords = [
    "ldap",
    "active-directory",
    "security",
    "audit",
    "enumeration",
    "ldif",
    "penetration-testing",
    "red-team",
]
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "ruff>=0.5",
    "mypy>=1.10",
    "pre-commit>=3.7",
]
test = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
]

[project.scripts]
tiny = "tiny.cli:main"

[project.urls]
Homepage = "https://github.com/USER/tiny-ldap"
Repository = "https://github.com/USER/tiny-ldap"
Issues = "https://github.com/USER/tiny-ldap/issues"
Changelog = "https://github.com/USER/tiny-ldap/blob/main/CHANGELOG.md"
Documentation = "https://github.com/USER/tiny-ldap/blob/main/README.md"

[tool.setuptools.packages.find]
where = ["src"]
include = ["tiny*"]

[tool.setuptools.package-data]
"*" = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
filterwarnings = [
    "ignore::DeprecationWarning",
]

[tool.ruff]
target-version = "py39"
line-length = 100
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
    "T20", # print statements
]
ignore = [
    "E501",  # line too long (handled by formatter)
    "T201",  # print statements allowed in CLI
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "T201"]  # assert and print allowed in tests

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
strict_optional = true
show_error_codes = true
pretty = true
namespace_packages = true
explicit_package_bases = true

[tool.mypy.overrides]
module = [
    "tiny.*",
]

[tool.coverage.run]
source = ["src/tiny"]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]
show_missing = true
skip_covered = true

[tool.pre-commit-hooks]
# See .pre-commit-config.yaml for full configuration