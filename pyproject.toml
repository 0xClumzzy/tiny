[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tiny-ldap"
version = "1.2.0"
description = "Rank LDAP dumps into a crown-jewel pyramid and split them into useful files"
readme = "README.md"
requires-python = ">=3.9"
dependencies = []

[project.scripts]
tiny = "tiny.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
